# Git hooks: run `uv run pre-commit install` once, then ruff runs before every commit.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint + fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]