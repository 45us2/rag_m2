[project]
name = "rag-m2"
version = "0.1.0"
description = "Multi-channel RAG (Core Rules PDF + SQLite) for Warhammer 40,000 questions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.129.0",
    "pypdf>=5.0.0",
    "google-genai>=1.40.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.0",
    "pydantic-settings>=2.10.0",
    "sentence-transformers>=5.0.0",
    "numpy>=2.0.0",
    "rich>=14.0.0",
    "prompt-toolkit>=3.0.0",
]

[dependency-groups]
eval = [
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.0",
    "langchain-community<0.4.2",  # ragas 0.4.3 imports chat_models.vertexai, removed in 0.4.2
]
dev = ["ruff>=0.14.0", "pytest>=8.0.0"]

[project.scripts]
rag-m2 = "rag_m2:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long prompts
